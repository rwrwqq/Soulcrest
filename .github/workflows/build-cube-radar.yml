# Builds Soulcrest with the live Hidden Cube radar in a fork (the official release.yml only runs in
# NewAge-BD/Soulcrest). Start it under Actions → "Build (Live Cube Radar)" → Run workflow, or push to main.
# The installer is attached to the run as an artifact. The map data package comes from the public
# "mapdata" release of the original repository, exactly like the official build.
name: Build (Live Cube Radar)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Inno Setup 7.1.0 (official, checked)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw "Unexpected Inno Setup hash $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process $exe -ArgumentList '/PORTABLE=1','/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw 'ISCC.exe missing' }

      - name: Map data package (from NewAge-BD/Soulcrest)
        shell: pwsh
        run: |
          gh release download mapdata --repo NewAge-BD/Soulcrest --pattern mapdata.zip --dir $env:RUNNER_TEMP
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'mapdata.zip') -DestinationPath imports/generated/mapdata
          if (-not (Test-Path imports/generated/mapdata/manifest.json)) { throw 'mapdata.zip has no manifest.json' }

      - name: Tests
        run: dotnet test Soulcrest.slnx -c Release

      - name: Installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Compiler (Join-Path $env:RUNNER_TEMP 'inno\ISCC.exe')

      - uses: actions/upload-artifact@v4
        with:
          name: Soulcrest-LiveCubeRadar-Setup
          path: |
            artifacts/installer/*-Setup-win-x64.exe
            artifacts/installer/*-Update-win-x64.exe
          if-no-files-found: error
